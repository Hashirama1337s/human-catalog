name: Report an error
description: Something in a part is wrong. A source is required.
labels: [error-report]
body:
  - type: input
    id: part
    attributes:
      label: Part number
      placeholder: HC-WRT-B3300-01
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What is wrong?
      options: [Date, Place, Wording or overclaim, Established/Debated mark, Broken source, Duplicate, Other]
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: The correction
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: A source you opened that shows it (link)
    validations:
      required: true
  - type: checkboxes
    id: opened
    attributes:
      label: Check
      options:
        - label: I opened this source and it says this.
          required: true
